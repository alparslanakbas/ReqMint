name: Windows development MSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store package version (four numeric parts; final part must be 0)
        required: true
        default: 1.0.0.0
        type: string
      architecture:
        description: Windows target architecture
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      REQMINT_IDENTITY_NAME: ${{ vars.REQMINT_STORE_IDENTITY_NAME }}
      REQMINT_PUBLISHER: ${{ vars.REQMINT_STORE_PUBLISHER }}
      REQMINT_PUBLISHER_DISPLAY_NAME: ${{ vars.REQMINT_STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Test release build
        run: dotnet test ReqMint.slnx --configuration Release

      - name: Build unsigned MSIX
        shell: pwsh
        run: |
          $identityName = if ($env:REQMINT_IDENTITY_NAME) { $env:REQMINT_IDENTITY_NAME } else { 'ReqMint.Development' }
          $publisher = if ($env:REQMINT_PUBLISHER) { $env:REQMINT_PUBLISHER } else { 'CN=ReqMint Development' }
          $publisherDisplayName = if ($env:REQMINT_PUBLISHER_DISPLAY_NAME) { $env:REQMINT_PUBLISHER_DISPLAY_NAME } else { 'ReqMint' }

          ./eng/package-windows.ps1 `
            -Version '${{ inputs.version }}' `
            -Architecture '${{ inputs.architecture }}' `
            -IdentityName $identityName `
            -Publisher $publisher `
            -PublisherDisplayName $publisherDisplayName

      - name: Upload MSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ReqMint-${{ inputs.version }}-${{ inputs.architecture }}-msix
          path: artifacts/packages/windows/*.msix
          if-no-files-found: error
