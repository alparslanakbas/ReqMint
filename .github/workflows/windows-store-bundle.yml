name: Windows Store bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store package version (four numeric parts; final part must be 0)
        required: true
        default: 1.0.0.0
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      REQMINT_IDENTITY_NAME: ${{ vars.REQMINT_STORE_IDENTITY_NAME }}
      REQMINT_PUBLISHER: ${{ vars.REQMINT_STORE_PUBLISHER }}
      REQMINT_PUBLISHER_DISPLAY_NAME: ${{ vars.REQMINT_STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate Microsoft Store identity
        shell: pwsh
        run: |
          $missingVariables = @()
          if ([string]::IsNullOrWhiteSpace($env:REQMINT_IDENTITY_NAME)) { $missingVariables += 'REQMINT_STORE_IDENTITY_NAME' }
          if ([string]::IsNullOrWhiteSpace($env:REQMINT_PUBLISHER)) { $missingVariables += 'REQMINT_STORE_PUBLISHER' }
          if ([string]::IsNullOrWhiteSpace($env:REQMINT_PUBLISHER_DISPLAY_NAME)) { $missingVariables += 'REQMINT_STORE_PUBLISHER_DISPLAY_NAME' }

          if ($missingVariables.Count -gt 0) {
            throw "Configure these GitHub repository variables with the exact Partner Center values: $($missingVariables -join ', ')"
          }

          if ($env:REQMINT_IDENTITY_NAME -eq 'ReqMint.Development' -or $env:REQMINT_PUBLISHER -eq 'CN=ReqMint Development') {
            throw 'Development identity values cannot be used for a Microsoft Store bundle.'
          }

      - name: Test release build
        run: dotnet test ReqMint.slnx --configuration Release

      - name: Build x64 and ARM64 MSIXBundle
        shell: pwsh
        run: |
          ./eng/package-windows-bundle.ps1 `
            -Version '${{ inputs.version }}' `
            -IdentityName $env:REQMINT_IDENTITY_NAME `
            -Publisher $env:REQMINT_PUBLISHER `
            -PublisherDisplayName $env:REQMINT_PUBLISHER_DISPLAY_NAME

      - name: Upload MSIXBundle
        uses: actions/upload-artifact@v7
        with:
          name: ReqMint-${{ inputs.version }}-store-msixbundle
          path: artifacts/packages/windows-store/*.msixbundle
          if-no-files-found: error
