name: Windows Store bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store package version (four numeric parts; final part must be 0)
        required: true
        default: 1.0.0.0
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      REQMINT_IDENTITY_NAME: ${{ vars.REQMINT_STORE_IDENTITY_NAME }}
      REQMINT_PUBLISHER: ${{ vars.REQMINT_STORE_PUBLISHER }}
      REQMINT_PUBLISHER_DISPLAY_NAME: ${{ vars.REQMINT_STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate Microsoft Store identity
        shell: pwsh
        run: |
          ./eng/Test-WindowsStoreIdentity.ps1 `
            -IdentityName $env:REQMINT_IDENTITY_NAME `
            -Publisher $env:REQMINT_PUBLISHER `
            -PublisherDisplayName $env:REQMINT_PUBLISHER_DISPLAY_NAME

      - name: Test release build
        run: dotnet test ReqMint.slnx --configuration Release

      - name: Build x64 and ARM64 MSIXBundle
        shell: pwsh
        run: |
          ./eng/package-windows-bundle.ps1 `
            -Version '${{ inputs.version }}' `
            -IdentityName $env:REQMINT_IDENTITY_NAME `
            -Publisher $env:REQMINT_PUBLISHER `
            -PublisherDisplayName $env:REQMINT_PUBLISHER_DISPLAY_NAME

      - name: Upload MSIXBundle
        uses: actions/upload-artifact@v7
        with:
          name: ReqMint-${{ inputs.version }}-store-msixbundle
          path: artifacts/packages/windows-store/*.msixbundle
          if-no-files-found: error
