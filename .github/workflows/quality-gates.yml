name: Quality gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform-tests:
    name: Release tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ReqMint.slnx

      - name: Test release build
        run: dotnet test ReqMint.slnx --configuration Release --no-restore

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ReqMint.slnx

      - name: Reject vulnerable direct or transitive packages
        shell: pwsh
        run: |
          $report = dotnet package list --project ReqMint.slnx --vulnerable --include-transitive --format json --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw 'The NuGet vulnerability audit could not be completed.'
          }

          $json = ($report | ConvertFrom-Json | ConvertTo-Json -Depth 100 -Compress)
          if ($json -match '"vulnerabilities":\[(?!\])') {
            $report | Write-Host
            throw 'A direct or transitive NuGet dependency has a known vulnerability.'
          }

          'No known vulnerable NuGet dependency was reported.' | Write-Host

  windows-store-assets:
    name: Approved Windows Store screenshots
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate approved localized screenshots
        shell: pwsh
        run: ./eng/Test-WindowsStoreScreenshots.ps1

  windows-store-layout:
    name: Windows Store layout (${{ matrix.architecture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Validate self-contained package layout
        shell: pwsh
        run: ./eng/package-windows.ps1 -Version 1.0.0.0 -Architecture '${{ matrix.architecture }}' -LayoutOnly

  website:
    name: Website build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Reject vulnerable website dependencies
        run: npm audit --audit-level=high

      - name: Build website
        run: npm run build
